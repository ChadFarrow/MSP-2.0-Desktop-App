name: Sync from Web Repo

on:
  repository_dispatch:
    types: [web-repo-updated]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/ChadFarrow/MSP-2.0.git || true
          git fetch upstream

      - name: Check for updates
        id: check
        run: |
          UPSTREAM_COMMITS=$(git rev-list master..upstream/master --count)
          echo "new_commits=$UPSTREAM_COMMITS" >> $GITHUB_OUTPUT

      - name: Merge upstream changes
        if: steps.check.outputs.new_commits != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge upstream/master --no-edit; then
            echo "conflicts=false" >> $GITHUB_OUTPUT
          else
            # Capture conflicting files before resolving
            CONFLICTING=$(git diff --name-only --diff-filter=U)
            echo "conflicting_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICTING" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "conflicts=true" >> $GITHUB_OUTPUT

            # Resolve conflicts by keeping our (desktop) version.
            #
            # Per-path, not `xargs git checkout --ours --` over the whole list: a
            # path we DELETED that upstream modified is a modify/delete conflict
            # with no stage-2 ("ours") blob, so checkout fails with "does not have
            # our version". Under `bash -e` that one error aborted the entire pass
            # before any real conflict was resolved, and the sync produced no PR at
            # all. That is not hypothetical — it is exactly what ci.yml did once
            # upstream edited a file this fork deletes (see "Remove web-only
            # workflows" below), taking 10 other resolvable conflicts down with it.
            #
            # Stage 2 is "ours" during a merge, so `git show :2:<path>` is the test
            # for whether there is an our-side version to restore at all.
            echo "$CONFLICTING" | while read -r f; do
              [ -n "$f" ] || continue
              if git show ":2:$f" >/dev/null 2>&1; then
                git checkout --ours -- "$f"
              else
                # Deleted on our side. Keep it deleted — that IS our version.
                git rm -f -- "$f" >/dev/null
              fi
            done
            git add -A
            git -c core.editor=true merge --continue
          fi

      # notify-desktop.yml is the web repo's dispatcher — it would fire this very
      # workflow at itself. ci.yml is the web repo's own build+test+lint job; test.yml
      # here already runs all of it, split into the separately-named checks that
      # master's branch protection requires, plus E2E and the dependency audit. Keeping
      # both would run every test twice under a `verify` check nothing gates on.
      - name: Remove web-only workflows
        if: steps.check.outputs.new_commits != '0'
        run: |
          rm -f .github/workflows/notify-desktop.yml
          rm -f .github/workflows/ci.yml
          git add -A

      - name: Build PR body
        if: steps.check.outputs.new_commits != '0'
        id: pr_body
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          CONFLICTING_FILES: ${{ steps.merge.outputs.conflicting_files }}
          NEW_COMMITS: ${{ steps.check.outputs.new_commits }}
        run: |
          {
            echo "body<<EOF"
            echo "Automated sync from [MSP-2.0 web repo](https://github.com/ChadFarrow/MSP-2.0)."
            echo ""
            echo "**New commits:** $NEW_COMMITS"
            echo ""
            if [ "$CONFLICTS" = "true" ]; then
              echo "⚠️ **Merge conflicts were auto-resolved (kept desktop version):**"
              echo "\`\`\`"
              echo "$CONFLICTING_FILES"
              echo "\`\`\`"
              echo "These files have desktop-specific changes. Review whether any upstream updates to these files need to be manually incorporated."
            else
              echo "✅ No merge conflicts."
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.new_commits != '0'
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SYNC_PAT }}
          title: "Sync updates from web repo"
          body: ${{ steps.pr_body.outputs.body }}
          branch: sync-upstream
          delete-branch: true
          labels: automated

      - name: Enable auto-merge on the sync PR
        # Auto-merge every sync PR. What actually gates the merge is master's
        # required status checks, NOT this workflow — and for a long time that list
        # was just ["Lint"], so PR #34 merged 28 seconds after Lint went green while
        # the unit tests were still failing, and master stayed red for three days
        # with no release. The list is now Lint + Unit Tests + E2E Tests +
        # Dependency Audit + Build; if you add a job to test.yml, add it there too
        # (gh api repos/:owner/:repo/branches/master/protection/required_status_checks)
        # or it gates nothing.
        #
        # A green synced build merges and releases itself so web updates auto-build;
        # a red one holds for a human. Caveat: conflict syncs auto-resolve to
        # desktop's version, so a silent drop that still COMPILES can merge without
        # review — the PR body lists the conflicted files for post-hoc audit.
        if: |
          steps.check.outputs.new_commits != '0'
          && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          echo "Enabling auto-merge on PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --auto --merge --repo "$GITHUB_REPOSITORY"
