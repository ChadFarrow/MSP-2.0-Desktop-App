name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Five jobs fan out per run, so a burst of merges leaves several full sets of
# them racing over commits that are already superseded. One run per ref at a
# time; the older one loses. Flip cancel-in-progress to
# `${{ github.ref != 'refs/heads/master' }}` if you'd rather every master commit
# keep its own test result and only cancel on PR branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job below carries the same guard, repeated because Actions has no YAML
# anchors:
#
#   if: github.event_name != 'push'
#       || !startsWith(github.event.head_commit.message, 'Merge pull request')
#
# sync-upstream.yml opens a PR and auto-merges it (`gh pr merge --auto --merge`).
# The five jobs run once on that PR, then the resulting push to master runs the
# identical five again — and because it is a *merge* commit, not a squash, master
# holds the exact tree the PR already tested. On Aug 12 that was 17 Tests runs,
# ~85 jobs, for ~6 syncs, and it was the largest Linux line on the account's
# Actions bill.
#
# The push trigger stays: a direct push to master (no PR, no prior run) still has
# to be tested. Only merge commits are skipped, which covers both the sync PRs and
# anything merged by hand through the UI, since both were tested as a PR first.
# A skipped job reports its check as skipped, which branch protection treats as
# passing — and protection gates PRs, not pushes, so nothing here can deadlock a
# merge.
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # Only a failing run has a report worth opening, and a week is longer than
      # any of these gets looked at. Uploading on every green run kept ~30 days of
      # reports alive against the account's 0.5 GB Actions storage allowance.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Nothing else here typechecks: E2E boots `npm run dev`, which skips tsc, so a
      # type error used to surface only in release.yml — after merge, in the job that
      # builds the app. `tsc -b` covers src, vite.config.ts and api (tsconfig.api.json).
      - name: Build (typecheck + bundle)
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Production deps only: dev-tooling transitives (e.g. via @vercel/node)
      # never ship, so they don't gate CI
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
