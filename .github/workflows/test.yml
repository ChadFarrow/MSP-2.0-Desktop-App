name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Five jobs fan out per run, so a burst of merges leaves several full sets of
# them racing over commits that are already superseded. One run per ref at a
# time; the older one loses. Flip cancel-in-progress to
# `${{ github.ref != 'refs/heads/master' }}` if you'd rather every master commit
# keep its own test result and only cancel on PR branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # Only a failing run has a report worth opening, and a week is longer than
      # any of these gets looked at. Uploading on every green run kept ~30 days of
      # reports alive against the account's 0.5 GB Actions storage allowance.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Nothing else here typechecks: E2E boots `npm run dev`, which skips tsc, so a
      # type error used to surface only in release.yml — after merge, in the job that
      # builds the app. `tsc -b` covers src, vite.config.ts and api (tsconfig.api.json).
      - name: Build (typecheck + bundle)
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Production deps only: dev-tooling transitives (e.g. via @vercel/node)
      # never ship, so they don't gate CI
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
